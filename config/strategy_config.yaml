# Configuración de la estrategia: NY Opening Range Breakout + Absorción CVD (continuación)
#
# Ver README.md para la explicación completa de cada regla.

instrument:
  ticker: "QQQ"          # Ticker a operar. QQQ = ETF Nasdaq-100 (horario regular NY).
                          # Para futuros (NQ=F) poner session_only: false.
  timezone: "America/New_York"

session:
  open: "09:30"
  close: "11:30"          # solo se opera dentro de las primeras 2 horas de la apertura de NY
  session_only: true      # true = descarta velas fuera del rango open-close (por hora local, cada día)

opening_range:
  minutes: 15              # Primeros N minutos de la sesión NY que marcan el high/low

volume_filter:
  # Exige que el volumen del rango de apertura sea "considerable" respecto al
  # volumen reciente antes de validar el día — así el rango de apertura solo
  # se toma en cuenta cuando de verdad hay una entrada de volumen que se
  # asemeja a la apertura real de NY (evita operar aperturas "de mentira" con
  # baja participación, p.ej. sesiones ilíquidas/feriados).
  enabled: true
  lookback_bars: 20        # velas previas usadas como línea base de volumen "normal"
  multiplier: 1.5          # el volumen del OR debe ser >= multiplier x la línea base

liquidity_filter:
  # Concepto de liquidez (ICT/SMC): un swing high/low formado con volumen
  # alto es un "pool de liquidez" (muchos stops/órdenes descansando ahí),
  # y por lo tanto un nivel más confiable para anclar el stop loss. Solo
  # se toma un SHORT si su swing high de referencia (el SL) tuvo volumen
  # alto al formarse; solo se toma un LONG si su swing low de referencia
  # lo tuvo. Si el swing más cercano no califica, se busca el siguiente
  # más cercano que sí tenga volumen alto; si ninguno califica, no hay
  # trade ese día (SL sin un nivel de liquidez real detrás).
  enabled: true
  lookback_bars: 20        # velas previas al swing usadas como línea base de volumen "normal"
  multiplier: 1.5          # el volumen de la vela del swing debe ser >= multiplier x la línea base

absorption:
  # Búsqueda de pivotes (fractales de 3 velas) dentro del pullback tras el rompimiento
  pivot_lookback: 1        # velas a cada lado para confirmar un pivote (3 velas totales)
  max_bars_after_breakout: null   # null = buscar hasta el cierre de sesión; o un entero de velas
  invalidate_on_full_retrace: true  # cancela el setup si el precio regresa a cruzar el otro lado del rango

risk:
  starting_equity: 10000
  risk_per_trade_pct: 1.0     # % de equity arriesgado por trade (define el tamaño de posición)
  sl_buffer_pct: 0.03         # buffer de seguridad debajo/encima del swing usado como SL (en % del precio)
  max_trades_per_day: 1
  slippage_bps: 1.0           # slippage estimado en entrada/salida, en basis points
  commission_per_trade: 0.0

swings:
  fractal_window: 3           # ventana (velas a cada lado) para detectar swing highs/lows históricos (SL/TP)
  lookback_days: 5            # días previos + día actual usados para buscar niveles de SL/TP

data:
  interval: "5m"               # granularidad de las velas (recomendado 1m o 5m para que el CVD tenga sentido)
  months_back: 6
